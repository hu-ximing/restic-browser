[package]
name = "restic-browser"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "A read-only terminal browser for restic repositories"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
futures-util = "0.3"
image = "0.25"
mime_guess = "2.0"
ratatui = "0.30"
ratatui-image = { version = "11.0", default-features = false, features = ["crossterm", "image-defaults"] }
rpassword = "7.4"
rtoolbox = "0.0.5"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tempfile = "3.20"
thiserror = "2.0"
tokio = { version = "1.47", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zeroize = "1.8"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
